<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Inventario de Cigarros</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- BARRA SUPERIOR COMPLETA A LO ANCHO DE LA PÁGINA -->
    <div class="barra-superior-reloj">
      <div class="reloj-contenido">
        <span class="reloj-icono">🕒</span>
        <span id="fecha-actual">Cargando fecha...</span>
        <span class="separador-barra">|</span>
        <span id="hora-actual">00:00:00</span>
      </div>
    </div>

    <div class="dashboard-global">
      <!-- PANEL DE CONTROL (IZQUIERDA) -->
      <aside class="panel-control">
        <h2>📋 Cierre de Turno</h2>
        <p class="instruccion">
          Cuente físicamente lo que quedó en el estante al final del día e
          ingrese las cantidades aquí.
        </p>

        <form id="formulario-inventario" onsubmit="event.preventDefault()">
          <div class="grupo-input">
            <label for="seleccionar-marca">1. Seleccione la Marca</label>
            <select id="seleccionar-marca">
              <option value="marlboro-clavo">Marlboro Clavo</option>
              <option value="marlboro-rojo">Marlboro Rojo</option>
              <option value="marlboro-blossom">Marlboro Blossom Mix</option>
              <option value="marlboro-velvet">Marlboro Fusion Velvet</option>
              <option value="marlboro-ruby">Marlboro Ruby</option>
              <option value="marlboro-garden">Marlboro Garden Fusion</option>
              <option value="marlboro-ice">Marlboro Ice Mix</option>
              <option value="marlboro-capsula">Marlboro Cápsula</option>
              <option value="marlboro-summer">Marlboro Summer Mix</option>
              <option value="marlboro-ruby-mix">Marlboro Ruby Mix</option>
              <option value="baronet-20">Baronet 20</option>
              <option value="baronet-25">Baronet 25</option>
              <option value="boots">Boots</option>
            </select>
          </div>

          <!-- CORREGIDO: Ambos campos ahora son estrictamente de CONTEO -->
          <div class="grupo-input">
            <label for="inventario-cajetillas"
              >2. Cajetillas Restantes (Conteo)</label
            >
            <input type="number" id="inventario-cajetillas" value="0" min="0" />
          </div>

          <div class="grupo-input">
            <label for="sueltos-restantes"
              >3. Cigarros Sueltos Restantes (Conteo)</label
            >
            <input type="number" id="sueltos-restantes" value="0" min="0" />
          </div>

          <button
            type="button"
            class="btn-actualizar"
            onclick="calcularInventarioCierre()"
          >
            Actualizar Dashboard
          </button>
        </form>
      </aside>

      <!-- DASHBOARD VISUAL (DERECHA) -->
      <main class="panel-visual">
        <header class="encabezado-dashboard">
          <h1>Existencias y Ventas del Día</h1>
          <p>Monitoreo por tipo de cigarro en bloques visuales paralelos.</p>
        </header>

        <div class="contenedor-marcas" id="dashboard-marcas">
          <!-- Las tarjetas se generan dinámicamente desde el JS -->
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
