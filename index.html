<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Cigarros</title>
    <!-- Enlace al archivo de estilos CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ==========================================
       BARRA SUPERIOR COMPLETA (ANCHO DE PÁGINA)
       ========================================== -->
    <div class="barra-superior-reloj">
      <div class="reloj-contenido">
        <span class="reloj-icono">🕒</span>
        <span id="fecha-actual">Cargando fecha...</span>
        <span class="separador-barra">|</span>
        <span id="hora-actual">00:00:00</span>
      </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL DEL DASHBOARD -->
    <div class="dashboard-global">
      <!-- ==========================================
           PANEL DE CONTROL (IZQUIERDA)
           ========================================== -->
      <aside class="panel-control">
        <h2>📋 Cierre de Inventario</h2>
        <p class="instruccion">
          Ingrese la cantidad con la que abrió en la mañana y el conteo físico
          de lo que esta entregando.
        </p>

        <form id="formulario-inventario" onsubmit="event.preventDefault()">
          <!-- 1. SELECCIÓN DE MARCA -->
          <div class="grupo-input">
            <label for="seleccionar-marca">1. Seleccione la Marca</label>
            <select id="seleccionar-marca">
              <option value="marlboro-clavo">Marlboro Clavo</option>
              <option value="marlboro-rojo">Marlboro Rojo</option>
              <option value="marlboro-blossom">Marlboro Blossom Mix</option>
              <option value="marlboro-velvet">Marlboro Fusion Velvet</option>
              <option value="marlboro-ruby">Marlboro Ruby</option>
              <option value="marlboro-garden">Marlboro Garden Fusion</option>
              <option value="marlboro-ice">Marlboro Ice Mix</option>
              <option value="marlboro-capsula">Marlboro Cápsula</option>
              <option value="marlboro-summer">Marlboro Summer Mix</option>
              <option value="marlboro-ruby-mix">Marlboro Ruby Mix</option>
              <option value="baronet-20">Baronet 20</option>
              <option value="baronet-25">Baronet 25</option>
              <option value="boots">Boots</option>
            </select>
          </div>

          <!-- 2. INVENTARIO INICIAL REAL DE LA MAÑANA -->
          <div class="form-section-separator">
            A. Inventario Inicial (Mañana)
          </div>
          <div class="grupo-input">
            <label for="inicial-cajetillas">Cajetillas Iniciales</label>
            <input type="number" id="inicial-cajetillas" value="0" min="0" />
          </div>
          <div class="grupo-input">
            <label for="inicial-sueltos">Sueltos Iniciales</label>
            <input type="number" id="inicial-sueltos" value="0" min="0" />
          </div>

          <!-- 3. CONTEO FÍSICO DEL CAMBIO DE TURNO -->
          <div class="form-section-separator">B. Inventario Final (Noche)</div>
          <div class="grupo-input">
            <label for="inventario-cajetillas">Cajetillas Restantes</label>
            <input type="number" id="inventario-cajetillas" value="0" min="0" />
          </div>
          <div class="grupo-input">
            <label for="sueltos-restantes">Cigarros Sueltos Restantes</label>
            <input type="number" id="sueltos-restantes" value="0" min="0" />
          </div>

          <!-- BOTONES DE ACCIÓN COMPLETA -->
          <button
            type="button"
            class="btn-actualizar"
            onclick="calcularInventarioCierre()"
          >
            Actualizar Dashboard
          </button>
          <button
            type="button"
            class="btn-reporte"
            onclick="generarReporteDelDia()"
          >
            📥 Descargar Reporte del Día
          </button>
        </form>
      </aside>

      <!-- ==========================================
           DASHBOARD VISUAL (DERECHA - EL TABLERO DE MAMÁ)
           ========================================== -->
      <main class="panel-visual">
        <header class="encabezado-dashboard">
          <h1>Existencias y Ventas del Día</h1>
          <p>Tipo de cigarro</p>
        </header>

        <div class="contenedor-marcas" id="dashboard-marcas">
          <!-- Las 13 tarjetas de las marcas se dibujan automáticamente aquí desde script.js -->
        </div>
      </main>
    </div>

    <!-- Enlace al archivo de lógica JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
